# CrossReach — infrastructure
#
# The application database runs on Neon (serverless Postgres) — see .env →
# DATABASE_URL / DIRECT_URL. Redis below is only needed for BullMQ-backed jobs;
# local dev runs fine without it (the app falls back to in-process scheduling).

services:
  redis:
    image: redis:7-alpine
    container_name: crossreach-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
