name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-test-build:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crossreach
          POSTGRES_PASSWORD: crossreach_dev
          POSTGRES_DB: crossreach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crossreach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://crossreach:crossreach_dev@localhost:5432/crossreach?schema=public
      NODE_ENV: test
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push schema to test database
        run: npx prisma db push

      - name: TypeScript typecheck (backend)
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        run: npm test

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard (typecheck + Vite)
        working-directory: dashboard
        run: npm run build
